repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        entry: npm exec --no -- commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true
