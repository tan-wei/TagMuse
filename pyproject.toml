[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tag-muse"
version = "0.1.0"
description = "Audit and normalize music tag metadata."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ftfy>=6.3.1",
  "lark>=1.3.1",
  "mutagen>=1.47.0",
  "rapidfuzz>=3.14.0",
  "rich>=14.0.0",
  "structlog>=25.4.0",
]

[project.scripts]
tag-muse = "tag_muse.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pre-commit>=4.2.0",
  "pytest>=8.3.5",
  "pytest-cov>=6.1.1",
  "ruff>=0.11.8",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["tag_muse"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = ["src"]
python_version = "3.11"
strict = true
